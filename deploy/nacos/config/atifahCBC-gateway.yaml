# 网关私有配置（Nacos data-id: atifahCBC-gateway.yaml, group: ATIFAHCBC_GATEWAY_GROUP）
# 通过 spring.config.import 可选引入，发布后覆盖本地 application.yml 同名项。
# 只放需要按环境覆盖或运行时调整的项；路由表、JWT 等稳定/敏感配置保留在本地
# application.yml 与环境变量，避免两处真相（不要把本地文件整份复制过来）。
# 刷新语义：whitelist 等集合由 Spring Cloud 重绑定 @ConfigurationProperties，改后发布即生效；
# auth.enabled 由 @ConditionalOnProperty 在启动时判定过滤器是否装配，修改后需重启网关。
# 日志配置在 atifahCBC-gateway/src/main/resources/application.yml；如需按环境覆盖，
# 可在此追加 logging.level.* / atifahCBC.logging.access.*，修改后需重启网关。

atifahCBC:
  gateway:
    auth:
      # 与本地默认一致：开启后除白名单外全部要求 Bearer 令牌
      enabled: true
      # 免鉴权路径；Actuator 只放行存活探针与指标抓取
      whitelist:
        - /api/v1/auth/
        - /actuator/health
        - /actuator/info
        - /actuator/prometheus
      # 管理端接口要求 admin 角色；管理端令牌签发接入后生效
      admin-paths:
        - /admin/api/
      role-claim: role
      admin-role: admin
      # WebSocket 握手改用查询参数传令牌，网关校验后剥离
      websocket-paths:
        - /ws/
      token-query-param: token
    rate-limit:
      # 规则按路由 ID 生效；打开前先在 Sentinel 控制台确认阈值
      enabled: false
      rules: []
